name: APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Buildozer
        run: pip install buildozer "Cython<3" setuptools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: APK derle
        run: yes | buildozer -v android debug

      - name: APK'yı yeniden adlandır
        run: cp bin/*.apk yilan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yilan-apk
          path: yilan.apk

      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Yılan v${{ github.run_number }}
          files: yilan.apk
          make_latest: true
